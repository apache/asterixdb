<h2 mat-dialog-title data-test-id="login-dialog-title">Sign in to AsterixDB</h2>
<form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="awc-login-form">
    <mat-dialog-content class="awc-login-content">
        <mat-form-field appearance="fill" class="awc-login-field">
            <mat-label>Username</mat-label>
            <input matInput
                   name="username"
                   data-test-id="login-username"
                   autocomplete="username"
                   [(ngModel)]="username"
                   required
                   cdkFocusInitial>
        </mat-form-field>
        <mat-form-field appearance="fill" class="awc-login-field">
            <mat-label>Password</mat-label>
            <input matInput
                   name="password"
                   data-test-id="login-password"
                   type="password"
                   autocomplete="current-password"
                   [(ngModel)]="password"
                   required>
        </mat-form-field>
        <p *ngIf="errorMessage" class="awc-login-error" data-test-id="login-error">{{ errorMessage }}</p>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <mat-progress-spinner *ngIf="submitting"
                              data-test-id="login-spinner"
                              mode="indeterminate"
                              diameter="20"
                              class="awc-login-spinner">
        </mat-progress-spinner>
        <button mat-raised-button
                color="primary"
                type="submit"
                data-test-id="login-submit"
                (click)="onSubmit()"
                [disabled]="loginForm.invalid || submitting">Sign in</button>
    </mat-dialog-actions>
</form>
