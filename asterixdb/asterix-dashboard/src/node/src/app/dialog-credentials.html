<h2 mat-dialog-title>Sign In</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Username</mat-label>
    <input matInput [(ngModel)]="data.username" autocomplete="username">
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Password</mat-label>
    <input matInput type="password" [(ngModel)]="data.password" autocomplete="current-password" (keydown.enter)="submit()">
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="!data.username">Sign In</button>
</mat-dialog-actions>
