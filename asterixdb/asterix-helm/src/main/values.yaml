# Number of node controllers. Each NC caches cloud storage locally and serves
# its share of the storage partitions.
numNodes: 3

# Number of storage partitions in the object store. Fixed for the lifetime of
# the cluster; these are spread across the NCs, so numNodes can change.
storagePartitions: 8

logLevel: INFO

# Image built by the podman.img profile of asterix-podman.
image:
  repository: docker.io/apache/asterixdb
  tag: latest
  pullPolicy: IfNotPresent

# HTTP basic auth for the CC and NC APIs. An empty password generates one,
# which is kept across upgrades. The credential file is read at startup, so
# CC and NC pods restart when these change.
auth:
  username: admin
  password: ""
  # Name of an existing Secret with a passwd key in the username:bcrypt-hash
  # form written by asterixhelper add_credential; username and password are
  # then ignored. Use this where the chart is rendered without cluster access
  # (helm template, GitOps), since a generated password would change on every
  # render. Changing that Secret needs a kubectl rollout restart of both
  # StatefulSets.
  existingSecret: ""

# Admits only this release's CC and NCs to each other's Hyracks ports, which
# are ephemeral on the NCs. Other sources reach only the API ports the pods
# declare: legacy-ui, api and web on the CC, nc-api on the NCs. Needs a network
# plugin that enforces NetworkPolicy.
networkPolicy:
  enabled: true
  # NetworkPolicy peers allowed to reach the API ports. Empty allows any source.
  apiFrom: []

cc:
  javaOpts: ""

nc:
  javaOpts: ""
  # Size limit of the emptyDir holding each NC's local cache and transaction
  # log. Empty means unlimited. Datasets declared with a type are logged here
  # until flushed, so a lost NC pod loses their unflushed writes; datasets
  # declared without one (PRIMARY KEY (id: int)) commit to the object store.
  cacheSizeLimit: ""

rustfs:
  image:
    repository: docker.io/rustfs/rustfs
    tag: 1.0.0-rc.6
    pullPolicy: IfNotPresent
  accessKey: asterixdb
  secretKey: asterixdb-secret
  bucket: asterixdb
  region: us-east-1
  persistence:
    # Empty uses the cluster's default storage class.
    storageClassName: ""
    size: 10Gi

bucketInit:
  image:
    repository: docker.io/curlimages/curl
    tag: 8.23.0
    pullPolicy: IfNotPresent
