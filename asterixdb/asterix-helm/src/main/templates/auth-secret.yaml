{{- if not .Values.auth.existingSecret }}
{{- $name := include "asterixdb.authSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $username := .Values.auth.username }}
{{- $password := .Values.auth.password }}
{{- if and (not $password) $existing.password }}
{{- $password = b64dec $existing.password }}
{{- end }}
{{- $password = $password | default (randAlphaNum 24) }}
{{- if or (contains ":" $username) (contains ":" $password) }}
{{- fail "auth.username and auth.password must not contain ':'" }}
{{- end }}
{{- /* htpasswd renders bcrypt's error into the file instead of failing, and bcrypt rejects anything longer */}}
{{- if gt (len $password) 72 }}
{{- fail "auth.password must not be longer than 72 bytes" }}
{{- end }}
{{- /* bcrypt salts every hash, so reuse the stored one to keep the Secret stable across upgrades */}}
{{- $passwd := htpasswd $username $password }}
{{- if and $existing.passwd $existing.username $existing.password }}
{{- if and (eq (b64dec $existing.username) $username) (eq (b64dec $existing.password) $password) }}
{{- $passwd = b64dec $existing.passwd }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "asterixdb.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ $username | quote }}
  password: {{ $password | quote }}
  passwd: {{ $passwd | quote }}
{{- end }}
