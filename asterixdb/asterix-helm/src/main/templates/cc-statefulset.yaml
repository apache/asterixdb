apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-cc
  labels:
    {{- include "asterixdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: cc
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "asterixdb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cc
  serviceName: {{ .Release.Name }}-svc
  template:
    metadata:
      labels:
        {{- include "asterixdb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cc
      annotations:
        kubectl.kubernetes.io/default-container: log
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/auth: {{ toJson .Values.auth | sha256sum }}
    spec:
      containers:
        - name: cc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "/opt/apache-asterixdb/bin/asterixcc" ]
          args: [ "-config-file", "/etc/asterixdb/cc.conf", "-address", "$(POD_IP)" ]
          workingDir: /var/lib/asterix
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JAVA_OPTS
              value: {{ .Values.cc.javaOpts | quote }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-s3-credentials
          ports:
            - containerPort: 19001
              name: legacy-ui
            - containerPort: 19002
              name: api
            - containerPort: 19006
              name: web
            - containerPort: 1098
              name: hyracks-ipc
            - containerPort: 1099
              name: hyracks-cluster
          volumeMounts:
            - name: work
              mountPath: /var/lib/asterix
            - name: config
              mountPath: /etc/asterixdb/
        - name: log
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "tail", "-n", "+1", "-F", "/var/lib/asterix/logs/cc.log" ]
          volumeMounts:
            - name: work
              mountPath: /var/lib/asterix
      volumes:
        - name: work
          emptyDir: {}
        - name: config
          projected:
            sources:
              - configMap:
                  name: {{ .Release.Name }}-configmap
              - secret:
                  name: {{ include "asterixdb.authSecretName" . }}
                  items:
                    - key: passwd
                      path: passwd
