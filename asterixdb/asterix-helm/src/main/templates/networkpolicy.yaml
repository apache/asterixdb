{{- if .Values.networkPolicy.enabled }}
{{- range $component, $apiPorts := dict "cc" (list "legacy-ui" "api" "web") "nc" (list "nc-api") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels:
    {{- include "asterixdb.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asterixdb.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes: [ Ingress ]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "asterixdb.selectorLabels" $ | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [ cc, nc ]
    - ports:
        {{- range $apiPorts }}
        - port: {{ . }}
        {{- end }}
      {{- with $.Values.networkPolicy.apiFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
