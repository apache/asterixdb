apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  labels:
    {{- include "asterixdb.labels" . | nindent 4 }}
data:
  cc.conf: |-
    {{- range until (.Values.numNodes | int) }}
    [nc/{{ $.Release.Name }}-nc-{{ . }}]
    iodevices = /var/lib/asterix/io1,/var/lib/asterix/io2
    {{- end }}

    [nc]
    ncservice.port = -1
    cluster.address = {{ include "asterixdb.ccAddress" . }}
    credential.file = /etc/asterixdb/passwd

    [cc]
    heartbeat.period = 2000
    credential.file = /etc/asterixdb/passwd

    [common]
    default.dir = /var/lib/asterix
    log.level = {{ .Values.logLevel }}
    storage.partitioning = static
    storage.partitions.count = {{ .Values.storagePartitions }}
    cloud.deployment = true
    cloud.storage.scheme = s3
    cloud.storage.bucket = {{ .Values.rustfs.bucket }}
    cloud.storage.region = {{ .Values.rustfs.region }}
    cloud.storage.endpoint = {{ include "asterixdb.rustfsEndpoint" . }}
    cloud.storage.force.path.style = true
