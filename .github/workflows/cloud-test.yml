# Converted from the Jenkins job asterix-gerrit-cloud-test
name: cloud-test

on:
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The profile's classes take over 4 hours back to back, so each long one gets its own runner.
  cloud-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: storage
            tests: CloudStorageTest
          - shard: storage-sparse
            tests: CloudStorageSparseTest
          - shard: storage-cancellation
            tests: CloudStorageCancellationTest
          - shard: lookup-and-s3
            tests: SqlppSinglePointLookupExecutionTest,AwsS3*
    uses: ./.github/workflows/maven-job.yml
    with:
      build: mvn -pl asterixdb/asterix-app -am clean install -DskipTests -Dskip.npm=true
      test: mvn -f asterixdb/asterix-app/pom.xml -Pasterix-gerrit-cloud-tests test -Dtest='${{ matrix.tests }}'
      timeout-minutes: 240
      artifact-name: logs-${{ matrix.shard }}
