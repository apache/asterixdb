name: integration-tests

# Post-commit rather than per pull request: ci already peaks at the 15 concurrent jobs the ASF recommends per
# workflow, so running this alongside it on every pull request would exceed that.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# A run in progress is never cancelled; pushes that land meanwhile collapse into one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-tests:
    uses: ./.github/workflows/maven-job.yml
    with:
      # python.path stays off the build: it activates asterix-app's environment setup, whose git clone of ch2 then
      # fails when verify runs it a second time without a clean.
      build: mvn clean install -DskipTests
      # RebalanceWithCancellationIT is timing-dependent (the rebalance count it expects varies with when the
      # cancellation lands), and PodmanPythonFunctionIT needs the image that only -Ppodman.tests builds.
      test: >-
        mvn verify -Dskip.surefire.tests=true -Poptimizer-tests,metadata-tests,execution-tests
        -Ditest.excludes='**/RebalanceWithCancellationIT.java' -pl '!:asterix-podman'
        -Dproject.build.sourceEncoding=UTF-8 -Dfile.encoding=UTF-8 -Dpython.path=/usr/bin/python3
      timeout-minutes: 240
      idle-timeout-minutes: 30
      artifact-name: logs-integration-tests
      artifacts: |
        target/threaddumps/**
        **/*.log
        **/*.out
        **/*.log.gz
        **/failsafe-reports/**
