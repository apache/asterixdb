# Converted from the Jenkins job asterix-gerrit-verify-asterix-app
name: verify-asterix-app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-asterix-app:
    uses: ./.github/workflows/maven-job.yml
    with:
      build: mvn -pl asterixdb/asterix-app -am clean install -DskipTests -Dskip.npm=true -Dpython.path=/usr/bin/python3
      test: mvn -f asterixdb/asterix-app/pom.xml verify -Pasterix-gerrit-verify-asterix-app
      timeout-minutes: 150
