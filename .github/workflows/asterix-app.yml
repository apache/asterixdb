# Converted from the Jenkins job asterix-gerrit-asterix-app-openjdk17
name: asterix-app

on:
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asterix-app:
    uses: ./.github/workflows/maven-job.yml
    with:
      build: mvn -pl asterixdb/asterix-app -am clean install -DskipTests -Dskip.npm=true
      test: mvn -f asterixdb/asterix-app/pom.xml clean test -Pasterix-gerrit-asterix-app
      timeout-minutes: 240
      idle-timeout-minutes: 10
      artifacts: |
        target/threaddumps/**
        **/*.log
        **/*.out
        **/*.log.gz
        asterixdb/asterix-app/target/SqlppNumericIndexRQGTest/*
        asterixdb/asterix-app/target/rttest/results/**
