# Converted from the Jenkins job asterix-gerrit-cloud-nons3-test
name: cloud-nons3-test

on:
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Back to back these run past any usable timeout (the GCS class alone takes hours by design: it injects I/O
  # failures and retries), so they are split across runners.
  cloud-nons3-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: gcs-unstable
            timeout: 360
            test: >-
              mvn -pl asterixdb/asterix-app -Pasterix-gerrit-cloud-nons3-tests,azurite-tests test
              -Dtest=GCSCloudStorageUnstableTest
          - shard: az-and-unstable
            timeout: 180
            test: >-
              mvn -pl asterixdb/asterix-app -Pasterix-gerrit-cloud-nons3-tests,azurite-tests test
              -Dtest=CloudStorageAzTest,CloudStorageUnstableTest
          - shard: azure-external-and-hdfs
            timeout: 180
            test: >-
              mvn -pl asterixdb/asterix-app -Pasterix-gerrit-cloud-nons3-tests,azurite-tests test
              -Dtest='AzureBlobStorageExternalDataset*Test,*SqlppHdfs*'
          - shard: asterix-cloud
            timeout: 180
            test: >-
              mvn -f asterixdb/asterix-cloud/pom.xml -Pazurite-tests test
              -Dproject.build.sourceEncoding=UTF-8 -Dfile.encoding=UTF-8
    uses: ./.github/workflows/maven-job.yml
    with:
      build: mvn -pl asterixdb/asterix-app -am clean install -DskipTests -Dskip.npm=true
      test: ${{ matrix.test }}
      timeout-minutes: ${{ matrix.timeout }}
      artifact-name: logs-${{ matrix.shard }}
      artifacts: |
        target/threaddumps/**
        **/*.log
        **/*.out
        **/*.log.gz
        **/*.dump
        **/*.dumpstream
        target/**
        **/surefire-reports/**
